<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ site.title }}</title>
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T8LKLDWM2F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T8LKLDWM2F');
  </script>

  <style>
    /* Force the colors using !important to override any background themes */
    h1 {
      color: #FF6C0C !important; /* Caltech Orange */
    }

    a {
      color: #00356b !important; /* Deep Blue */
      text-decoration: none;
    }

    a:hover {
      color: #FF6C0C !important;
      text-decoration: underline;
    }

    /* Keep the body readable */
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      margin-bottom: 2rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>{{ site.title }}</h1>
    </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <hr>
    <p>Last updated: Feb 2026 | {{ site.title }}</p>
  </footer>
</body>
</html>
